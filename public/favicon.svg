<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2a04a"/>
      <stop offset="100%" stop-color="#c4863a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Main building body -->
  <rect x="14" y="28" width="36" height="24" rx="1" fill="#2a2a40" stroke="#e2a04a" stroke-width="1"/>
  <!-- Roof -->
  <polygon points="10,28 32,12 54,28" fill="url(#roof)" opacity="0.9"/>
  <!-- Roof trim -->
  <line x1="10" y1="28" x2="54" y2="28" stroke="#e2a04a" stroke-width="1.5"/>
  <!-- Left tower -->
  <rect x="10" y="20" width="8" height="32" fill="#2a2a40" stroke="#e2a04a" stroke-width="0.8"/>
  <rect x="9" y="18" width="10" height="3" rx="0.5" fill="#e2a04a" opacity="0.85"/>
  <!-- Right tower -->
  <rect x="46" y="20" width="8" height="32" fill="#2a2a40" stroke="#e2a04a" stroke-width="0.8"/>
  <rect x="45" y="18" width="10" height="3" rx="0.5" fill="#e2a04a" opacity="0.85"/>
  <!-- Tower pinnacles -->
  <polygon points="14,18 10,18 12,14" fill="#e2a04a" opacity="0.8"/>
  <polygon points="54,18 50,18 52,14" fill="#e2a04a" opacity="0.8"/>
  <!-- Windows - left tower -->
  <rect x="12" y="24" width="4" height="5" rx="0.5" fill="#4db6ac" opacity="0.5"/>
  <!-- Windows - right tower -->
  <rect x="48" y="24" width="4" height="5" rx="0.5" fill="#4db6ac" opacity="0.5"/>
  <!-- Main windows row -->
  <rect x="20" y="32" width="5" height="6" rx="0.5" fill="#4db6ac" opacity="0.4"/>
  <rect x="29.5" y="32" width="5" height="6" rx="0.5" fill="#4db6ac" opacity="0.4"/>
  <rect x="39" y="32" width="5" height="6" rx="0.5" fill="#4db6ac" opacity="0.4"/>
  <!-- Door -->
  <rect x="28" y="42" width="8" height="10" rx="1" fill="#1a1a2e" stroke="#e2a04a" stroke-width="0.8"/>
  <circle cx="34" cy="48" r="0.8" fill="#e2a04a"/>
  <!-- 44 text -->
  <text x="32" y="58" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2a04a" opacity="0.95">44</text>
</svg>
